# Captures d'écran du site en ligne, pour contrôler une mise à jour. Lancement manuel ;
# les images sont déposées sur la branche « probe-output » (jamais fusionnée).
name: Capture du site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node scripts/capture-site.mjs
      - name: Déposer les captures
        run: |
          cd probe
          git init -q -b probe-output
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Captures du site"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-output
