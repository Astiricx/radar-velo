# Sonde des sites de vélos neufs : vérifie, depuis les serveurs de GitHub, quelles pages
# sont lisibles et garde leur contenu en pièce jointe de l'exécution. Lancement manuel.
name: Sonde des sources

on:
  workflow_dispatch:
    inputs:
      urls:
        description: Adresses à lire, séparées par des espaces
        type: string
        required: true

permissions:
  # Pour déposer les pages lues sur la branche « probe-output ».
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-sources.mjs
        env:
          PROBE_URLS: ${{ inputs.urls }}
      # Pages lues déposées sur une branche à part (jamais fusionnée), pour étude.
      - name: Déposer les pages lues
        run: |
          cd probe
          git init -q -b probe-output
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Pages lues par la sonde"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-output
