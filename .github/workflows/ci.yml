# Vérifie à chaque push et pull request que le projet compile.
name: CI

on:
  push:
    branches: [main]
    # Les commits de la veille quotidienne ne touchent que data/ : pas besoin de recompiler.
    paths-ignore: ['data/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # « npm ci » si package-lock.json est commité, sinon « npm install ».
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run typecheck
      - run: npm run build
