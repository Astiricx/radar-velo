# Publie l'application sur GitHub Pages : https://astiricx.github.io/radar-velo/
name: Site

on:
  push:
    branches: [main]
    # Les commits de la veille quotidienne ne touchent que data/ : pas de republication.
    paths-ignore: ['data/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; la plus récente remplace celle en cours.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Active GitHub Pages (source : GitHub Actions) s'il ne l'est pas encore.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npm run build
        env:
          BASE_PATH: /radar-velo/
      # GitHub Pages sert 404.html pour toute adresse inconnue.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
