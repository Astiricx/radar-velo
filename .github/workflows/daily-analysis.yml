# Veille quotidienne : collecte Leboncoin et buycycle (Apify), Troc-Vélo (Puppeteer Scraper d'Apify, vrai navigateur)
# et Decathlon Occasion (lecture directe, Cheerio Scraper en secours), analyse, enregistre data/ et republie le site.
name: Veille quotidienne

on:
  schedule:
    # Tous les jours à 8 h UTC, soit 9 h à Paris en hiver et 10 h en été.
    # GitHub peut décaler un peu les exécutions planifiées aux heures chargées.
    - cron: '0 8 * * *'
  # Bouton « Run workflow » dans l'onglet Actions.
  workflow_dispatch:
    inputs:
      simulation:
        description: Ajouter des annonces inventées (test, jamais publiées sur le site)
        type: boolean
        default: false
      rescan:
        description: Réanalyser aussi les annonces déjà vues (après un changement de règles)
        type: boolean
        default: false
      backfill:
        description: Collecte de rattrapage (Leboncoin 150, buycycle 400, Troc-Vélo 3 pages ; ~0,25 $)
        type: boolean
        default: false
      debug:
        description: Journal détaillé (extraits bruts des fiches, décision par vignette)
        type: boolean
        default: false
      max_items:
        description: Annonces Leboncoin lues par zone pour cette exécution (vide = réglage habituel)
        type: string
        default: ''

permissions:
  contents: write
  # Pour relancer la publication du site après la veille.
  actions: write

concurrency:
  group: veille-quotidienne
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Collecter et analyser les nouvelles annonces
        id: veille
        run: npm run daily-check
        env:
          # Clé d'API Apify : secret de dépôt APIFY_TOKEN. Sans elle, la collecte est sautée.
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # Réglages facultatifs (variables de dépôt), valeurs par défaut dans scripts/apify/config.ts.
          APIFY_BUDGET_USD: ${{ vars.APIFY_BUDGET_USD }}
          APIFY_MAX_ITEMS: ${{ inputs.max_items || (inputs.backfill && '150') || vars.APIFY_MAX_ITEMS }}
          BUYCYCLE_MAX_ITEMS: ${{ (inputs.backfill && '400') || vars.BUYCYCLE_MAX_ITEMS }}
          BUYCYCLE_ENABLED: ${{ vars.BUYCYCLE_ENABLED }}
          LEBONCOIN_SCOPE: ${{ vars.LEBONCOIN_SCOPE }}
          VEILLE_RESCAN: ${{ inputs.rescan && 'true' || 'false' }}
          VEILLE_DEBUG: ${{ inputs.debug && 'true' || 'false' }}
          TROCVELO_LIST_PAGES: ${{ (inputs.backfill && '3') || vars.TROCVELO_LIST_PAGES }}
          APIFY_PROXY_GROUPS: ${{ vars.APIFY_PROXY_GROUPS || secrets.APIFY_PROXY_GROUPS }}
          DECATHLON_ENABLED: ${{ vars.DECATHLON_ENABLED }}
          DECATHLON_MAX_ITEMS: ${{ vars.DECATHLON_MAX_ITEMS }}
          APIFY_LEBONCOIN_ACTOR: ${{ vars.APIFY_LEBONCOIN_ACTOR }}
          TROCVELO_ENABLED: ${{ vars.TROCVELO_ENABLED }}
          TROCVELO_SEARCH_URL: ${{ vars.TROCVELO_SEARCH_URL }}
          TROCVELO_MAX_ITEMS: ${{ vars.TROCVELO_MAX_ITEMS }}
          # Variable de dépôt, ou secret du même nom s'il a été créé comme secret.
          TROCVELO_PROXY_GROUPS: ${{ vars.TROCVELO_PROXY_GROUPS || secrets.TROCVELO_PROXY_GROUPS }}
          TROCVELO_ACTOR: ${{ vars.TROCVELO_ACTOR }}
          VEILLE_SIMULATION: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.simulation) || vars.VEILLE_SIMULATION || 'false' }}

      - name: Enregistrer les résultats sur main
        id: commit
        # Mettre la variable de dépôt COMMIT_RESULTS à « false » pour une simple exécution de contrôle.
        if: vars.COMMIT_RESULTS != 'false'
        env:
          MESSAGE: ${{ steps.veille.outputs.commit_message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
            exit 0
          fi
          git commit -m "$MESSAGE"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Un commit fait par l'Action ne relance pas les autres workflows : on demande
      # explicitement la republication du site pour qu'il affiche les nouvelles annonces.
      - name: Republier le site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
