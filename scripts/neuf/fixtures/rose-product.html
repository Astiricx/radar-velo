<html><head>
<script data-test="product-schema-data" type="application/ld+json" data-hid="seoProduct">{"@context":"https://schema.org/","@graph":[{"@type":"Product","brand":"Rose","logo":"https://cdn.rosebikes.de/cms/cms.62bb045fdee222.61569267.png","name":"Shave Ultegra Di2","category":"Route","image":"https://cdn.rosebikes.de/images/246E3AA3C1BD0C75495A17A8B25499E1.png?im=Resize=(800,800);BackgroundColor=ffffff","itemCondition":"https://schema.org/NewCondition","color":"supersonic grey","size":"XS","sku":"235015901","gtin13":"","mpn":"","description":"\u003Cp>Aero ou Endurance? Le Shave réunit les deux. Un vélo de course qui rompt les catégories et vous pousse à rouler vite plus longtemps. Ergonomique pour vos plus longues sorties. Aérodynamique pour plus de vitesse. Esthétique pour se sentir encore mieux. Avec le cadre en carbone léger, la géométrie longue distance et le capteur de puissance intégré, il élève vos ambitions au niveau supérieur.&#160;\u003C/p>\r\n\u003Cp>&#160;\u003C/p>\r\n\u003Cp>Points forts:&#160;\u003Cbr />• design de cadre AergoConcept : position érgo &#38; forme aéro\u003Cbr />• poste de pilotage en carbone : aérodynamique, ergonomique, entièrement intégré\u003Cbr />• tige de selle reculée : le confort du carbone avec extra-flexibilité\u003Cbr />• 36 mm de dégagement pour les pneus : plus de marge pour des pneus plus larges\u003Cbr />• transmission électronique : rapide, précis, intuitif\u003Cbr />• capteur de puissance intégré : mesure de la puissance en temps réel\u003C/p>\r\n\u003Cp>&#160;\u003C/p>\r\n\u003Cp>Le Shave Ultegra Di2 est équipé du groupe électronique Shimano Ultegra Di2 avec 2x12 vitesses et capteur de puissance 4iiii intégré. Les roues Newmen A.50 Aero en carbone, équipées de pneus Conti Grand Prix de 32 mm de large, permettent d'économiser d’énergie et d'augmenter l'amortissement. La selle Novus Boost Evo de Selle Italia atteint en outre un équilibre idéal entre performance et confort. &#160;\u003C/p>\r\n\u003Cp>\u003Cbr />¹&#160;env. 7,8 kg, il y a éventuellement une marge jusqu’à +/- 5% due à la fabrication, poids pour le cadre en supersonic grey, taille M, sans les pédales.\u003Cbr />Pour les ajustements individuels de la hauteur, des entretoises de 30 mm sont installées sous le poste de pilotage à la livraison. Les illustrations montrent le Shave sans entretoises avec un pivot de fourche raccourci.&#160;\u003Cbr />&#160;\u003C/p>        \u003Cbr>\u003Cbr>Fabricant:&nbsp;Rose Bikes GmbH, Schersweide 4, 46395 Bocholt, Germany, www.rosebikes.de    ","offers":{"@type":"Offer","availability":"InStock","url":"/fr/p/rose-shave-ultegra-di2-2726129","price":4440,"priceCurrency":"EUR","sku":"235015901","shippingDetails":{"@context":"https://schema.org","@type":"OfferShippingDetails","deliveryTime":{"@type":"ShippingDeliveryTime","businessDays":{"@type":"OpeningHoursSpecification","dayOfWeek":["https://schema.org/Monday","https://schema.org/Tuesday","https://schema.org/Wednesday","https://schema.org/Thursday","https://schema.org/Friday","https://schema.org/Saturday"]},"handlingTime":{"@type":"QuantitativeValue","minValue":1,"maxValue":1,"unitCode":"d"},"transitTime":{"@type":"QuantitativeValue","minValue":1,"maxValue":1,"unitCode":"d"}},"shippingRate":{"@type":"MonetaryAmount","value":49.95,"currency":"EUR"}}},"aggregateRating":{"@type":"AggregateRating","ratingValue":3.875,"ratingCount":8},"review":[[{"@type":"Review","author":{"@type":"Person","name":"Beat"},"datePublished":"2026-10-30","reviewBody":"Fantastisches Rennrad, ich habe meine ersten 1500 km durch und bin begeistert. Dazu kommt: es sieht auch noch super aus.","name":"Shave Ultegra Di2","reviewRating":{"@type":"Rating","worstRating":"1","bestRating":"5","ratingValue":5}},{"@type":"Review","author":{"@type":"Person","name":"Ulrike"},"datePublished":"2026-10-18","reviewBody":"So ein schönes Bike. Habe es seit Ende Mai und bin immer noch total begeistert. \r\n\r\nBei der ersten Ausfahrt, dachte ich tatsächlich, dass das Shave zu schnell für mich ist 😂. Aber wir haben uns sehr schnell gut aneinander gewöhnt und ich freue mich bei jeder Tour über das tolle Bike. \r\n\r\nAuch die Erstmontage war übrigens gar nicht kompliziert (und ich habe wirklich keine Erfahrung im Zusammenbauen von Bikes).\r\n\r\nIch würde allen, die auch keine Ahnung vom Zusammenbauen von Bikes haben, tatsächlich empfehlen, direkt einen Drehmoment-Schlüssel mitzubestellen.  Den braucht es schon, wenn man sicher unterwegs sein will. \r\n\r\n\r\n\r\n","name":"Shave Ultegra Di2","reviewRating":{"@type":"Rating","worstRating":"1","bestRating":"5","ratingValue":5}},{"@type":"Review","author":{"@type":"Person","name":"Tomaž"},"datePublished":"2026-10-02","reviewBody":"I just had my first 100kms with my Shave, and in comparison to my previous Pinarello x3 bike, it rides very well, it is fast on descents, it is very comfortable, seat suits me well... now I will go also to bike fit to micro adjust my position. The only - is mount for garmin, it is vibrating quite a lot on rough road, so perhaps it should be modified a little to be installed (hanged) on cockpit also from the top, not only with screws under it...\r\nSo, overall great bike! Kudos\r\nTomaž, Slovenia","name":"Shave Ultegra Di2","reviewRating":{"@type":"Rating","worstRating":"1","bestRating":"5","ratingValue":5}},{"@type":"Review","author":{"@type":"Person","name":"Michael"},"datePublished":"2026-08-25","reviewBody":"Macht Freude. Einzig die Kette machte viel Lärm. Habe eine M-9100- Kette verbaut. Seither ist die Laufruhe perfekt.","name":"Shave Ultegra Di2","reviewRating":{"@type":"Rating","worstRating":"1","bestRating":"5","ratingValue":4}},{"@type":"Review","author":{"@type":"Person","name":"Rolf"},"datePublished":"2026-05-08","reviewBody":"Ich bin mehr als zufrieden mit dem Rad. Der Rahmen ist perfekt verarbeitet & lackiert. Das Cockpit ist sehr clean & ergonomisch. Mir gefällt das minimalistische Design des Rades.\r\n\r\nBei meinem Rad war alles super eingestellt und montiert. Nach der ersten 100km Runde habe ich den Gabelschaft etwas gekürzt und schaue mal, wie sich das anfühlt. Das Rad ist einfach zu schick für einen Spacerturm :-).\r\n\r\nDas Fahrverhalten ist aus meiner Sicht großartig. Es geht schnell nach vorne, die 32er Reifen bieten viel Kontrolle & Grip, das Rad fühlt sich direkt und effizient an. Die Felgen sind sehr gut. Auch im Wiegetritt bergauf fühlt sich das Rad sehr stabil und gut an. Zudem liegt es klasse im Wind und ist bergab flott unterwegs. Die Lastverteilung vorne / hinten ist sehr gut und ich sitze schön zentral im Rad.\r\n\r\nVerbesserungspotential:\r\n\r\nBei dem Preispunkt sollten Tubeless-Ventile beiliegen, finde ich. Und ein passendes Kabel, um die Shifter updaten zu können. Da die Di2-Batterie sich im Unterrohr befindet, kommt man da nicht so einfach hin. Alles nicht schlimm, aber es wäre cool, wenn das beiliegen würde.\r\n\r\nIch bin 1,76 m (Schrittlänge 81,5 cm). M passt perfekt.","name":"Shave Ultegra Di2","reviewRating":{"@type":"Rating","worstRating":"1","bestRating":"5","ratingValue":5}},{"@type":"Review","author":{"@type":"Person","name":"Andre"},"datePublished":"2026-05-03","reviewBody":"Voller Vorfreude nach Anleitung aufgebaut.\r\nGenerell nicht sehr gut verpackt. Auch lose Plastiktüten waren im Karton. Sah auf den ersten Blick aus wie schonmal wiederverpackt.\r\nKann allerdings auch an der Montage seitens Rose liegen. (Meine Vermutung) Also erstmal unbedenklich.\r\nIn den letzten Zügen dann leider bemerkt dass das Carbon Oberrohr an einer Stelle ungewöhnlich weich ist und stark knackt. Das Kabel für den Umwerfer rutscht nach 10m probe rollen raus und hält nicht mehr 100 prozentig. Und im Tretlager Bereich ist etwas lose bzw. liegt eventuell etwas im Rahmen. \r\nBitte kontrolliert eure bikes vor der ersten Fahrt.","name":"Shave Ultegra Di2","reviewRating":{"@type":"Rating","worstRating":"1","bestRating":"5","ratingValue":1}},{"@type":"Review","author":{"@type":"Person","name":"Jan"},"datePublished":"2026-04-29","reviewBody":"","name":"Shave Ultegra Di2","reviewRating":{"@type":"Rating","worstRating":"1","bestRating":"5","ratingValue":5}},{"@type":"Review","author":{"@type":"Person","name":"NICHOLAS"},"datePublished":"2026-03-11","reviewBody":"Shave is DEAD ON ARRIVAL.  Di2 does nothing.  No lights when the Di2 button pressed.  No lights when charger connected.  Nothing at all.  Is there even a battery in the bike?  Unbelievable!","name":"Shave Ultegra Di2","reviewRating":{"@type":"Rating","worstRating":"1","bestRating":"5","ratingValue":1}}]]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Page d'accueil","item":"https://www.rosebikes.fr/"},{"@type":"ListItem","position":2,"name":"Cycles","item":"https://www.rosebikes.fr/cycles"},{"@type":"ListItem","position":3,"name":"Route","item":"https://www.rosebikes.fr/cycles/route"},{"@type":"ListItem","position":4,"name":"Course","item":"https://www.rosebikes.fr/cycles/route/course"},{"@type":"ListItem","position":5,"name":"Shave","item":"https://www.rosebikes.fr/cycles/route/course/shave"},{"@type":"ListItem","position":6,"name":"Shave Ultegra Di2","item":"https://www.rosebikes.fr/p/rose-shave-ultegra-di2-2726129"}]}]}</script>
